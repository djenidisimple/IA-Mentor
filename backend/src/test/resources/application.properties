# Test configuration - use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Avoid binding errors for other placeholders used in main application
server.port=0
JWT_SECRET=test-secret
JWT_EXPIRATION=3600
GITHUB_CLIENT_ID=test
GITHUB_CLIENT_SECRET=test
URL_FRONTEND=http://localhost:3000

# Disable OAuth2 auto-configuration for tests if not needed
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Map JWT env names expected by application
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}
