# ==========================================
# Nom de l'application
# ==========================================
spring.application.name=ai-mentor

# Ajoute ces lignes
logging.level.com.djenidi.ai_mentor=DEBUG
logging.level.org.springframework.scheduling=DEBUG
logging.level.org.springframework.transaction=DEBUG

# ==========================================
# Configuration PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_mentor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuration JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Configuration du serveur
# ==========================================
server.port=${SERVER_PORT}

# ==========================================
# Configuration Sécurité JWT
# ==========================================
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}

# ==========================================
# Configuration OAuth2 GitHub
# ==========================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.web.cors.allowed-origins=${URL_FRONTEND}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
# ==========================================
# Ollama Configuration (Local - Gemma2:2b-cpu)
# ==========================================
ollama.api.url=http://localhost:11434
ollama.model=gemma2:2b

# ==========================================
# Groq Configuration (Cloud API)
# ==========================================
