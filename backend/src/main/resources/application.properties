# ==========================================
# Nom de l'application
# ==========================================
spring.application.name=ai-mentor

# Ajoute ces lignes
logging.level.com.djenidi.ai_mentor=DEBUG
logging.level.org.springframework.scheduling=DEBUG
logging.level.org.springframework.transaction=DEBUG

# src/main/resources/application.properties

# ── Base de données ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_PASSWORD}@db.fllrvwaeccrdfwvupzgg.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Remplace app.jwt.secret par le nom exact qu'attend JwtService
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:900000}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_DAYS:90}

# ── GitHub OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ── Scheduling (nettoyage des tokens expirés) ─────────────────────────────────
spring.task.scheduling.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.djenidi.ai_mentor=INFO
logging.level.org.springframework.security=WARN

# ==========================================
# Groq Configuration (Cloud API)
# ==========================================
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile