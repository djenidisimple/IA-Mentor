# ==========================================
# Nom de l'application
# ==========================================
spring.application.name=ai-mentor

# Ajoute ces lignes
logging.level.com.djenidi.ai_mentor=DEBUG
logging.level.org.springframework.scheduling=DEBUG
logging.level.org.springframework.transaction=DEBUG

# src/main/resources/application.properties

# ── Base de données ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_mentor_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Remplace app.jwt.secret par le nom exact qu'attend JwtService
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:900000}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_DAYS:90}

# ── GitHub OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ── Scheduling (nettoyage des tokens expirés) ─────────────────────────────────
spring.task.scheduling.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.djenidi.ai_mentor=INFO
logging.level.org.springframework.security=WARN

# ==========================================
# OpenRouter Configuration (modèles gratuits)
# ==========================================
ai.api.url=https://openrouter.ai/api/v1/chat/completions
ai.api.key=${OPENROUTER_API_KEY:}
# Liste ordonnée : le premier modèle est utilisé, les suivants servent de repli
ai.models=cohere/north-mini-code:free,google/gemma-4-31b-it:free
ai.max.tokens=4096